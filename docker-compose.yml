version: "3.8"
services:
  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pulseneo
      POSTGRES_USER: admin
      PGUSER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d pulseneo -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
